    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var patchDescriptor = function (target) {
            if (!target) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, "fetch");
              if (desc && (!desc.writable || !desc.set)) {
                Object.defineProperty(target, "fetch", {
                  configurable: true,
                  enumerable: true,
                  get: function () {
                    return currentFetch;
                  },
                  set: function (fn) {
                    if (typeof fn === "function") {
                      currentFetch = fn;
                    }
                  },
                });
              }
            } catch (err) {}
          };
          patchDescriptor(window);
          patchDescriptor(Object.getPrototypeOf(window));
          if (typeof Window !== "undefined" && Window.prototype) {
            patchDescriptor(Window.prototype);
          }
        } catch (e) {}
      })();
    </script>
